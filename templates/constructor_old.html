<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Этикеток</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .nav a { color: white; text-decoration: none; margin-right: 15px; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .toolbar { width: 250px; background: white; padding: 15px; overflow-y: auto; border-right: 1px solid #ddd; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #e0e0e0; position: relative; }
        #canvas { background: white; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }
        .properties { width: 280px; background: white; padding: 15px; overflow-y: auto; border-left: 1px solid #ddd; }
        .tool-group { margin-bottom: 20px; }
        .tool-group h3 { font-size: 14px; margin-bottom: 10px; color: #666; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 3px; font-size: 13px; }
        .btn-tool { background: #f0f0f0; width: 100%; text-align: left; }
        .btn-primary { background: #667eea; color: white; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
        .color-picker { display: flex; gap: 5px; flex-wrap: wrap; }
        .color-swatch { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid #ddd; }
        @media (max-width: 768px) { .main { flex-direction: column; } .toolbar, .properties { width: 100%; height: 200px; } }
    </style>
</head>
<body>
    <div class="header">
        <h2>🎨 Конструктор Этикеток</h2>
        <nav class="nav">
            <a href="/dashboard">📊 Dashboard</a>
            <a href="#" onclick="saveTemplate()">💾 Save</a>
            <a href="#" onclick="printLabel()">🖨️ Print</a>
        </nav>
    </div>
    
    <div class="main">
        <div class="toolbar">
            <div class="tool-group">
                <h3>📝 Text</h3>
                <button class="btn btn-tool" onclick="addText()">Add Text</button>
                <button class="btn btn-tool" onclick="addDate()">Add Date</button>
                <button class="btn btn-tool" onclick="addVariable()">Variable</button>
            </div>
            <div class="tool-group">
                <h3>🔷 Shapes</h3>
                <button class="btn btn-tool" onclick="addRect()">Rectangle</button>
                <button class="btn btn-tool" onclick="addCircle()">Circle</button>
                <button class="btn btn-tool" onclick="addLine()">Line</button>
            </div>
            <div class="tool-group">
                <h3>📊 Codes</h3>
                <button class="btn btn-tool" onclick="addBarcode()">Barcode</button>
                <button class="btn btn-tool" onclick="addQRCode()">QR Code</button>
            </div>
            <div class="tool-group">
                <h3>🖼️ Image</h3>
                <input type="file" id="imgUpload" accept="image/*" onchange="addImage(this)">
            </div>
            <div class="tool-group">
                <h3>⚙️ Settings</h3>
                <label>Width (mm)</label>
                <input type="number" id="labelWidth" value="50">
                <label>Height (mm)</label>
                <input type="number" id="labelHeight" value="30">
                <button class="btn btn-primary" onclick="resizeCanvas()">Apply</button>
            </div>
        </div>
        
        <div class="canvas-area">
            <canvas id="canvas" width="500" height="300"></canvas>
        </div>
        
        <div class="properties">
            <div class="tool-group">
                <h3>🎨 Properties</h3>
                <label>Text</label>
                <input type="text" id="propText" oninput="updateProp()">
                <label>Font Size</label>
                <input type="number" id="propFontSize" value="16" oninput="updateProp()">
                <label>Color</label>
                <div class="color-picker">
                    <div class="color-swatch" style="background:#000" onclick="setColor('#000')"></div>
                    <div class="color-swatch" style="background:#fff" onclick="setColor('#fff')"></div>
                    <div class="color-swatch" style="background:#f00" onclick="setColor('#f00')"></div>
                    <div class="color-swatch" style="background:#0f0" onclick="setColor('#0f0')"></div>
                    <div class="color-swatch" style="background:#00f" onclick="setColor('#00f')"></div>
                </div>
                <input type="color" id="propColor" value="#000000" oninput="updateProp()">
                <label>Position X</label>
                <input type="number" id="propX" oninput="updateProp()">
                <label>Position Y</label>
                <input type="number" id="propY" oninput="updateProp()">
                <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="deleteSelected()">🗑️ Delete</button>
            </div>
            <div class="tool-group">
                <h3>📋 Layers</h3>
                <div id="layersList"></div>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let elements = [];
        let selected = null;
        let mmToPx = 10;
        
        function init() {
            resizeCanvas();
            draw();
            canvas.addEventListener('mousedown', onSelect);
            canvas.addEventListener('mousemove', onMove);
            canvas.addEventListener('mouseup', onRelease);
        }
        
        function resizeCanvas() {
            const w = parseFloat(document.getElementById('labelWidth').value) * mmToPx;
            const h = parseFloat(document.getElementById('labelHeight').value) * mmToPx;
            canvas.width = w;
            canvas.height = h;
            draw();
        }
        
        function addText() {
            elements.push({type:'text', x:50, y:50, text:'Text', fontSize:16, color:'#000'});
            draw();
            updateLayers();
        }
        
        function addDate() {
            const now = new Date().toLocaleDateString();
            elements.push({type:'text', x:50, y:80, text:now, fontSize:14, color:'#000'});
            draw();
        }
        
        function addVariable() {
            elements.push({type:'text', x:50, y:110, text:'{VAR}', fontSize:14, color:'#00f'});
            draw();
        }
        
        function addRect() {
            elements.push({type:'rect', x:50, y:50, w:100, h:50, color:'#667eea'});
            draw();
        }
        
        function addCircle() {
            elements.push({type:'circle', x:100, y:75, r:30, color:'#764ba2'});
            draw();
        }
        
        function addLine() {
            elements.push({type:'line', x1:50, y1:150, x2:200, y2:150, color:'#000', width:2});
            draw();
        }
        
        function addBarcode() {
            elements.push({type:'barcode', x:50, y:200, value:'1234567890', w:150, h:50});
            draw();
        }
        
        function addQRCode() {
            elements.push({type:'qrcode', x:250, y:50, value:'QR Data', size:80});
            draw();
        }
        
        function addImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        elements.push({type:'image', x:50, y:50, img: img, w:100, h:100});
                        draw();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            elements.forEach((el, i) => {
                if (el.type === 'text') {
                    ctx.fillStyle = el.color;
                    ctx.font = `${el.fontSize}px Arial`;
                    ctx.fillText(el.text, el.x, el.y);
                } else if (el.type === 'rect') {
                    ctx.fillStyle = el.color;
                    ctx.fillRect(el.x, el.y, el.w, el.h);
                } else if (el.type === 'circle') {
                    ctx.beginPath();
                    ctx.arc(el.x, el.y, el.r, 0, Math.PI*2);
                    ctx.fillStyle = el.color;
                    ctx.fill();
                } else if (el.type === 'line') {
                    ctx.strokeStyle = el.color;
                    ctx.lineWidth = el.width;
                    ctx.beginPath();
                    ctx.moveTo(el.x1, el.y1);
                    ctx.lineTo(el.x2, el.y2);
                    ctx.stroke();
                } else if (el.type === 'barcode') {
                    ctx.fillStyle = '#000';
                    for(let j=0; j<el.value.length; j++) {
                        const bw = el.w / el.value.length;
                        ctx.fillRect(el.x + j*bw, el.y, bw/2, el.h);
                    }
                } else if (el.type === 'qrcode') {
                    ctx.fillStyle = '#000';
                    const s = el.size/10;
                    for(let r=0; r<10; r++) {
                        for(let c=0; c<10; c++) {
                            if(Math.random()>0.5) ctx.fillRect(el.x+c*s, el.y+r*s, s-1, s-1);
                        }
                    }
                } else if (el.type === 'image') {
                    ctx.drawImage(el.img, el.x, el.y, el.w, el.h);
                }
                
                if (selected === i) {
                    ctx.strokeStyle = '#667eea';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(el.x-5, el.y-5, (el.w||100)+10, (el.h||el.r*2||20)+10);
                }
            });
        }
        
        function onSelect(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            for(let i=elements.length-1; i>=0; i--) {
                const el = elements[i];
                if (x >= el.x && x <= el.x+(el.w||el.r*2||100) && y >= el.y && y <= el.y+(el.h||el.r*2||20)) {
                    selected = i;
                    document.getElementById('propText').value = el.text || '';
                    document.getElementById('propFontSize').value = el.fontSize || 16;
                    document.getElementById('propColor').value = el.color || '#000000';
                    document.getElementById('propX').value = el.x;
                    document.getElementById('propY').value = el.y;
                    draw();
                    updateLayers();
                    return;
                }
            }
            selected = null;
            draw();
        }
        
        let dragging = false;
        function onMove(e) {
            if (dragging && selected !== null) {
                const rect = canvas.getBoundingClientRect();
                elements[selected].x = e.clientX - rect.left;
                elements[selected].y = e.clientY - rect.top;
                draw();
            }
        }
        
        function onRelease() { dragging = false; }
        
        function updateProp() {
            if (selected !== null) {
                const el = elements[selected];
                if (el.text !== undefined) el.text = document.getElementById('propText').value;
                if (el.fontSize !== undefined) el.fontSize = parseInt(document.getElementById('propFontSize').value);
                if (el.color !== undefined) el.color = document.getElementById('propColor').value;
                if (el.x !== undefined) el.x = parseInt(document.getElementById('propX').value);
                if (el.y !== undefined) el.y = parseInt(document.getElementById('propY').value);
                draw();
            }
        }
        
        function setColor(c) {
            if (selected !== null) {
                elements[selected].color = c;
                document.getElementById('propColor').value = c;
                draw();
            }
        }
        
        function deleteSelected() {
            if (selected !== null) {
                elements.splice(selected, 1);
                selected = null;
                draw();
                updateLayers();
            }
        }
        
        function updateLayers() {
            const list = document.getElementById('layersList');
            list.innerHTML = elements.map((el,i) => 
                `<div style="padding:5px;background:${i===selected?'#e0e0ff':'#f0f0f0'};margin:2px;border-radius:3px;cursor:pointer" onclick="selected=${i};draw()">${el.type} ${el.text||''}</div>`
            ).join('');
        }
        
        function saveTemplate() {
            const name = prompt('Template name:');
            if (!name) return;
            
            fetch('/api/templates', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: name,
                    content: {elements: elements, width: canvas.width/mmToPx, height: canvas.height/mmToPx},
                    width: parseFloat(document.getElementById('labelWidth').value),
                    height: parseFloat(document.getElementById('labelHeight').value)
                })
            }).then(r=>r.json()).then(d=>{
                if(d.success) alert('Saved!');
            });
        }
        
        function printLabel() {
            const copies = prompt('Copies:', '1');
            fetch('/api/print', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({copies: parseInt(copies)})
            }).then(r=>r.json()).then(d=>{
                if(d.success) alert('Print job sent!');
            });
        }
        
        init();
    </script>
</body>
</html>
