<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Login - Sticker Printer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            text-align: center; 
            max-width: 400px; 
            width: 90%;
        }
        h1 { color: #667eea; margin-bottom: 20px; font-size: 24px; }
        .qr-container { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 10px; 
            margin: 20px 0; 
        }
        .qr-image { 
            max-width: 250px; 
            height: auto; 
        }
        .token { 
            font-family: monospace; 
            font-size: 18px; 
            background: #f0f0f0; 
            padding: 10px; 
            border-radius: 5px; 
            margin: 15px 0;
            word-break: break-all;
        }
        .instructions { 
            color: #666; 
            font-size: 14px; 
            line-height: 1.6; 
            margin: 20px 0; 
        }
        .btn { 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: white; 
            padding: 12px 30px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            text-decoration: none; 
            display: inline-block; 
            margin: 10px 5px;
        }
        .timer { 
            font-size: 14px; 
            color: #ff9800; 
            margin-top: 15px; 
        }
        @media (max-width: 480px) {
            .login-card { padding: 20px; }
            .qr-image { max-width: 200px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🔐 QR Login</h1>
        <p class="instructions">Scan this QR code with your mobile device to login instantly</p>
        
        <div class="qr-container">
            <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code" class="qr-image">
        </div>
        
        <div class="token">{{ token }}</div>
        
        <p class="instructions">Or enter this token manually on your device</p>
        
        <div>
            <a href="/login" class="btn">← Back to Login</a>
        </div>
        
        <div class="timer">This code expires in 5 minutes</div>
    </div>
    
    <script>
        // Auto refresh QR code every 5 minutes
        setTimeout(() => location.reload(), 300000);
    </script>
</body>
</html>
